<style>
:root {
  /* Мир аватарки: вечерняя комната, бордовые обои, огоньки ёлки и камина */
  --wall: #26120f;
  --ink: #2b1a17;
  --paper: #fbf3ea;
  --gold: #f3c76e;
  --blush: #f5b8c6;
  --muted: #b99a8e;
  --font-pixel: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  /* Раскладка: комната-панорама во всю высоту листается вбок, задание сверху, диалог поверх всего */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--wall); color: var(--paper); font-family: var(--font-body); overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.viewport {
  position: fixed; inset: 0; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -webkit-overflow-scrolling: touch; cursor: grab;
}
.viewport::-webkit-scrollbar { display: none; }
.viewport.drag { cursor: grabbing; }
.pano {
  position: relative; height: 100%; aspect-ratio: 2280 / 1200;
  background: url("room.png") left top / 100% 100% no-repeat;
  image-rendering: pixelated;
}
.peek {
  position: absolute; image-rendering: pixelated; pointer-events: none;
  transition: opacity .35s; z-index: 2;
}
.peek.wiggle { animation: peekw .45s ease-in-out 3; }
@keyframes peekw { 25% { transform: translateX(-0.6%); } 75% { transform: translateX(0.6%); } }

/* свечение огоньков */
.glow { position: absolute; border-radius: 50%; pointer-events: none; z-index: 1; mix-blend-mode: screen;
  transform: translate(-50%, -50%); background: radial-gradient(circle, var(--c) 0%, transparent 65%); opacity: .55; }
.glow.twinkle { animation: tw var(--t) ease-in-out infinite; animation-delay: var(--dl); }
.glow.flicker { animation: fl 0.9s ease-in-out infinite alternate; animation-delay: var(--dl); }
@keyframes tw { 50% { opacity: .15; } }
@keyframes fl { 0% { opacity: .5; transform: translate(-50%, -50%) scale(1); } 100% { opacity: .75; transform: translate(-50%, -52%) scale(1.08); } }
#snow { position: absolute; z-index: 1; pointer-events: none; image-rendering: pixelated; }

.spot { position: absolute; z-index: 3; border: 0; padding: 0; background: transparent; cursor: pointer; }
.spot:focus-visible { outline: 2px dashed var(--gold); outline-offset: -2px; }
.spot.cat { z-index: 6; }

.task {
  position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%);
  width: min(92vw, 440px); padding: 11px 14px; border-radius: 14px; text-align: center;
  background: rgba(30, 14, 12, .78); backdrop-filter: blur(4px);
  font-size: 16px; line-height: 1.4; font-weight: 600; z-index: 20; transition: opacity .4s;
  box-shadow: 0 0 0 2px rgba(243, 199, 110, .35);
}
.task b { color: var(--gold); }
.soundbox {
  position: fixed; right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 70;
  display: flex; align-items: center; gap: 10px; padding: 0; border-radius: 12px;
  background: rgba(30, 14, 12, .78); box-shadow: 0 0 0 2px rgba(243, 199, 110, .35);
}
.sound {
  width: 44px; height: 44px; border-radius: 12px; border: 0; cursor: pointer; font-size: 20px;
  background: transparent; color: var(--paper);
}
.vol { display: none; width: 110px; margin-right: 14px; accent-color: var(--gold); cursor: pointer; }
.vol:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
@media (hover: hover) and (pointer: fine) { .vol { display: block; } }
.credit {
  position: fixed; left: 10px; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 70;
  font-size: 10px; line-height: 1.3; color: rgba(251, 243, 234, .45); max-width: 46vw; pointer-events: none;
}
.sound:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.swipe {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20;
  font-family: var(--font-pixel); font-size: 14px; font-weight: 700; color: var(--paper); white-space: nowrap;
  background: rgba(30, 14, 12, .7); padding: 9px 12px; border-radius: 10px; transition: opacity .5s; pointer-events: none;
}
.swipe span { display: inline-block; animation: nudge 1.2s ease-in-out infinite; }
.swipe span:last-child { animation-direction: reverse; }
@keyframes nudge { 50% { transform: translateX(-4px); } }

.pop {
  position: fixed; z-index: 30; transform: translate(-50%, -100%);
  background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 700;
  padding: 7px 10px; border-radius: 10px; white-space: nowrap; pointer-events: none;
  box-shadow: 0 0 0 2px var(--ink); animation: floatup 1.7s ease forwards;
}
@keyframes floatup { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; margin-top: 0; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: -14px; } }
.mrr { position: absolute; z-index: 7; font-family: var(--font-pixel); font-size: 16px; font-weight: 800; color: var(--paper);
  text-shadow: 0 0 6px #000; pointer-events: none; animation: floatup 2.2s ease forwards; transform: translate(-50%, -100%); }

/* встреча с Моисеем */
.stage { position: fixed; inset: 0; z-index: 40; pointer-events: none; display: flex; justify-content: center; }
.stage.on { pointer-events: auto; }
.veil { position: absolute; inset: 0; background: rgba(18, 8, 6, 0); transition: background .6s; }
.stage.on .veil { background: rgba(18, 8, 6, .6); }
.inner { position: relative; width: min(100%, 480px); height: 100%; }
.moisey {
  position: absolute; left: 50%; top: 12%; width: 76%; aspect-ratio: 600 / 727;
  transform-origin: 50% 90%; opacity: 0;
}
.face {
  position: absolute; inset: 0; background: url("moisey.png") center / contain no-repeat;
  transform-origin: 50% 85%; transition: transform .09s ease-out;
}
.moisey.in { animation: jump .9s cubic-bezier(.2,1.3,.4,1) forwards; }
.moisey.grumpy { opacity: 1; animation: breathe 1.1s ease-in-out infinite; }
.moisey.soft { opacity: 1; animation: breathe 2.8s ease-in-out infinite; }
@keyframes jump {
  0% { opacity: 1; transform: translate(var(--fx), var(--fy)) scale(.16); }
  60% { opacity: 1; transform: translate(-50%, -6%) scale(1.04); }
  100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
@keyframes breathe { 0%, 100% { transform: translate(-50%, 0) scale(1, 1); } 50% { transform: translate(-50%, 0) scale(1.012, .985); } }
.steam { position: absolute; left: 76%; top: 14%; font-size: 26px; opacity: 0; transition: opacity .3s; }
.steam.on { opacity: 1; animation: puff 1.2s ease-in-out infinite; }
@keyframes puff { 50% { transform: scale(1.2) translateY(-4px); } }
#hearts { position: absolute; inset: 0; pointer-events: none; }
.dialog {
  position: absolute; left: 4%; right: 4%; bottom: max(3%, env(safe-area-inset-bottom));
  background: var(--paper); color: var(--ink); border-radius: 16px;
  padding: 26px 16px 14px; min-height: 150px;
  box-shadow: 0 0 0 4px var(--ink), 0 0 0 7px var(--gold);
  display: none; flex-direction: column; gap: 10px; cursor: pointer;
}
.dialog.on { display: flex; }
.name { position: absolute; top: -14px; left: 14px; padding: 7px 10px; border-radius: 8px;
  background: var(--ink); color: var(--gold); font-family: var(--font-pixel); font-size: 14px; font-weight: 800; letter-spacing: .06em; box-shadow: 0 0 0 2px var(--gold); }
.line { font-size: 17px; line-height: 1.5; font-weight: 600; min-height: 3em; }
.next { align-self: flex-end; font-family: var(--font-pixel); font-size: 14px; color: #9a6e60; animation: blinkn 1s steps(2) infinite; }
@keyframes blinkn { 50% { opacity: 0; } }
.go { align-self: stretch; font: inherit; font-size: 16px; font-weight: 700; border: 0; border-radius: 12px;
  padding: 13px; background: var(--ink); color: var(--gold); cursor: pointer; display: none; }
.go:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.stub { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px; text-align: center; background: rgba(30,16,14,.94); }
.stub.on { display: flex; }
.stub h2 { font-family: var(--font-pixel); font-size: 20px; font-weight: 800; line-height: 1.4; color: var(--gold); margin: 0; }
.stub p { margin: 0; font-size: 15px; line-height: 1.5; color: #e6d6cc; max-width: 30ch; }
.stub button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; }
@media (prefers-reduced-motion: reduce) {
  .glow.twinkle, .glow.flicker, .moisey.grumpy, .moisey.soft, .steam.on, .swipe span { animation: none; }
  .face { transition: none; }
}
</style>
</head>

<div class="viewport" id="vp">
  <div class="pano" id="pano">
    <canvas id="snow"></canvas>
    <img class="peek" id="peek" src="peek.png" alt="">
  </div>
</div>

<div class="task" id="task">Кажется, в этой комнате <b>кто-то прячется</b>. Найди его 👀</div>
<div class="credit" id="credit">♪ «We Wish You a Merry Christmas» — Kevin MacLeod (incompetech.com) · CC BY 4.0</div>
<div class="soundbox"><button type="button" class="sound" id="soundBtn" aria-label="Звук">🔊</button><input type="range" class="vol" id="vol" min="0" max="100" step="1" value="70" aria-label="Громкость"></div>
<div class="swipe" id="swipe"><span>←</span> листай комнату <span>→</span></div>

<div class="stage" id="stage">
  <div class="veil"></div>
  <div class="inner" id="inner">
    <div class="moisey" id="moisey" role="img" aria-label="Моисей"><div class="face" id="face"></div></div>
    <div class="steam" id="steam" aria-hidden="true">💢</div>
    <canvas id="hearts"></canvas>
    <div class="dialog" id="dialog" role="dialog" aria-live="polite">
      <span class="name">МОИСЕЙ</span>
      <div class="line" id="line"></div>
      <div class="next" id="next">▼</div>
      <button type="button" class="go" id="goBtn">Пойдём 🧡</button>
    </div>
  </div>
</div>

<div class="stub" id="stub">
  <h2>ЗАДАНИЕ 2</h2>
  <p>Здесь будет следующее задание. Сделаем его на следующем шаге.</p>
  <button type="button" id="restart">Пройти «Найди кота» заново</button>
</div>

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = level(); master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.5;
    sfxBus.connect(master);
  }

  const N = { G4: 392.0, C5: 523.25, E5: 659.25 };

  function bell(freq, t, dur, vol, bus) {
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o1.type = "sine"; o2.type = "triangle";
    o1.frequency.value = freq; o2.frequency.value = freq * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.5, dur * 1.6));
    o1.start(t); o2.start(t); o1.stop(t + dur * 1.7 + 0.1); o2.stop(t + dur * 1.7 + 0.1);
  }

  const MUSIC_FILE = "music.mp3";
  function playFile() {
    return fetch(MUSIC_FILE)
      .then(r => { if (!r.ok) throw new Error("нет файла"); return r.arrayBuffer(); })
      .then(buf => new Promise((ok, fail) => ctx.decodeAudioData(buf, ok, fail)))
      .then(buffer => {
        const src = ctx.createBufferSource(), g = ctx.createGain();
        src.buffer = buffer; src.loop = true;
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime + 2.5);   // плавное появление, тише голоса
        src.connect(g); g.connect(master);
        src.start();
      });
  }
  function start() {
    init();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!started) {
      started = true;
      playFile().catch(() => {});
    }
  }

  // ГОЛОС МОИСЕЯ: мультяшные «мя» на каждый гласный (слог), как в Animal Crossing.
  // Высота зависит от гласной, поэтому фраза звучит как речь с интонацией.
  // Ворчит: ниже, ровнее, чуть «бубнит». Нежный: выше, звонче, с подъёмом в конце слога.
  // Конец фразы: «?» — тон вверх, «!» — громче и выше, «…» — тише и мягче.
  const VOWEL_PITCH = { "а": 1, "я": 1.04, "о": .92, "ё": .98, "у": .87, "ю": .94, "э": 1.07, "е": 1.1, "и": 1.18, "ы": 1.12,
                        "a": 1, "o": .92, "u": .87, "e": 1.1, "i": 1.18, "y": 1.12 };
  function syllable(vowel, mood, tail) {
    if (!ctx || muted) return;
    const grumpy = mood === "grumpy";
    const t = ctx.currentTime + 0.005;
    let f = (grumpy ? 250 : 470) * (VOWEL_PITCH[vowel] || 1) * (0.97 + Math.random() * 0.06);
    let dur = grumpy ? 0.085 : 0.095, vol = grumpy ? 0.3 : 0.26;
    let bend = grumpy ? 0.97 : 1.12;
    if (tail === "?") { bend = 1.35; dur *= 1.6; }
    if (tail === "!") { f *= 1.12; vol *= 1.3; }
    if (tail === "…") { dur *= 1.5; vol *= 0.65; bend = 0.92; }
    const o = ctx.createOscillator(), o2 = ctx.createOscillator();
    const g = ctx.createGain(), g2 = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = "sine"; o2.type = "triangle"; g2.gain.value = grumpy ? 0.35 : 0.18;
    o.frequency.setValueAtTime(f * 0.94, t);
    o.frequency.exponentialRampToValueAtTime(f * bend, t + dur);
    o2.frequency.setValueAtTime(f * 0.94, t);
    o2.frequency.exponentialRampToValueAtTime(f * bend, t + dur);
    lp.type = "lowpass"; lp.frequency.value = grumpy ? 1400 : 2600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.setValueAtTime(vol, t + dur * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(sfxBus);
    o.start(t); o2.start(t); o.stop(t + dur + 0.02); o2.stop(t + dur + 0.02);
  }
  // маленькие звуки событий
  function boop() {
    if (!ctx || muted) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.12);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.16);
  }
  function found() {
    if (!ctx || muted) return;
    ["C5","E5","G4","C5","E5"].forEach((n, i) => bell(N[n] * (i > 2 ? 2 : 1), ctx.currentTime + i * 0.09, 0.4, 0.45, sfxBus));
  }
  function setMuted(v) {
    muted = v;
    try { localStorage.setItem("moisey-muted", v ? "1" : "0"); } catch (e) {}
    if (master) master.gain.setTargetAtTime(level(), ctx.currentTime, 0.05);
  }
  function setVolume(v) {
    volume = v;
    try { localStorage.setItem("moisey-volume", String(v)); } catch (e) {}
    if (master) master.gain.setTargetAtTime(level(), ctx.currentTime, 0.05);
  }
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (started) ctx.resume();
  });
  return { start, syllable, boop, found, setMuted, setVolume, get muted() { return muted; }, get volume() { return volume; } };
})();

const soundBtn = document.getElementById("soundBtn");
soundBtn.textContent = Sound.muted ? "🔇" : "🔊";
soundBtn.addEventListener("click", (e) => {
  e.stopPropagation(); Sound.start();
  Sound.setMuted(!Sound.muted); soundBtn.textContent = Sound.muted ? "🔇" : "🔊";
});
const vol = document.getElementById("vol");
vol.value = Math.round(Sound.volume * 100);
vol.addEventListener("input", () => {
  Sound.start(); Sound.setVolume(vol.value / 100);
  if (Sound.muted && vol.value > 0) { Sound.setMuted(false); soundBtn.textContent = "🔊"; }
});
["pointerdown", "keydown"].forEach(ev => vol.addEventListener(ev, (e) => e.stopPropagation()));
// браузеры разрешают звук только после первого касания
["pointerdown", "touchstart", "keydown"].forEach(ev => addEventListener(ev, () => Sound.start(), { once: true, passive: true }));

/* ========================================================== */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor("#26120f"); tg.setBackgroundColor("#26120f"); } catch (e) {}
  try { tg.disableVerticalSwipes(); } catch (e) {}
}
const haptic = (k) => { try { tg && tg.HapticFeedback.impactOccurred(k); } catch (e) {} };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const vp = document.getElementById("vp"), pano = document.getElementById("pano");
const pct = (v, i) => (v / GRID[i] * 100) + "%";
function place(el, r) {
  el.style.left = pct(r[0], 0); el.style.top = pct(r[1], 1);
  el.style.width = pct(r[2] - r[0], 0); el.style.height = pct(r[3] - r[1], 1);
}

/* выглядывающий кот */
const peek = document.getElementById("peek");
place(peek, PEEK);

/* огоньки */
LIGHTS.forEach((L, i) => {
  const g = document.createElement("div");
  g.className = "glow" + (L.twinkle ? " twinkle" : "") + (L.flicker ? " flicker" : "");
  const size = (L.s * 6) / GRID[1] * 100;
  g.style.cssText = `left:${pct(L.x + .5, 0)};top:${pct(L.y + .5, 1)};height:${size}%;aspect-ratio:1;--c:${L.c};` +
    `--t:${(1.6 + (i * 37 % 20) / 10).toFixed(1)}s;--dl:-${(i * 53 % 30) / 10}s;`;
  pano.appendChild(g);
});

/* снег за окном */
const sc = document.getElementById("snow"), sx = sc.getContext("2d");
place(sc, WINDOW_GLASS);
sc.width = (WINDOW_GLASS[2] - WINDOW_GLASS[0]); sc.height = (WINDOW_GLASS[3] - WINDOW_GLASS[1]);
const flakes = Array.from({ length: 22 }, () => ({ x: Math.random() * sc.width, y: Math.random() * sc.height, v: .08 + Math.random() * .12 }));
function snowLoop() {
  sx.clearRect(0, 0, sc.width, sc.height);
  sx.fillStyle = "#e4ecf6";
  flakes.forEach(f => {
    f.y += f.v; f.x += Math.sin(f.y / 6) * .05;
    if (f.y > sc.height) { f.y = 0; f.x = Math.random() * sc.width; }
    const rx = Math.round(f.x), ry = Math.round(f.y);
    if ((rx < 28 || rx > 30) && (ry < 35 || ry > 37)) sx.fillRect(Math.round(f.x), Math.round(f.y), 1, 1);
  });
  if (!reduce) requestAnimationFrame(snowLoop);
}
snowLoop();

/* зоны */
let misses = 0, found = false, idleTimer;
SPOTS.forEach(s => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "spot"; b.setAttribute("aria-label", s.say);
  place(b, s.r);
  b.addEventListener("click", (e) => { if (moved) return; miss(s.say, e.clientX, e.clientY); });
  pano.appendChild(b);
});
const catSpot = document.createElement("button");
catSpot.type = "button"; catSpot.className = "spot cat"; catSpot.setAttribute("aria-label", "Кто-то выглядывает из-за ёлки");
place(catSpot, CAT);
catSpot.addEventListener("click", () => { if (!moved) findCat(); });
pano.appendChild(catSpot);

function say(text, x, y) {
  const p = document.createElement("div");
  p.className = "pop"; p.textContent = text;
  p.style.left = Math.min(Math.max(x, 100), innerWidth - 100) + "px"; p.style.top = (y - 8) + "px";
  document.body.appendChild(p); setTimeout(() => p.remove(), 1800);
}
function miss(text, x, y) {
  if (found) return;
  misses++; haptic("light"); Sound.boop(); say(text, x, y); resetIdle();
  if (misses === 4) hint(false);
  if (misses === 8) hint(true);
}
function hint(strong) {
  if (found) return;
  peek.classList.remove("wiggle"); void peek.offsetWidth; peek.classList.add("wiggle");
  const m = document.createElement("div");
  m.className = "mrr"; m.textContent = "мрр…";
  m.style.left = pct(CAT[0] + 10, 0); m.style.top = pct(CAT[1], 1);
  pano.appendChild(m); setTimeout(() => m.remove(), 2300);
  if (strong) {
    document.getElementById("task").innerHTML = "Кажется, у <b>ёлки</b> кто-то шуршит 👀";
    const target = pano.clientWidth * (CAT[0] / GRID[0]) - innerWidth / 2;
    vp.scrollTo({ left: target, behavior: reduce ? "auto" : "smooth" });
  } else {
    document.getElementById("task").innerHTML = "Прислушайся… где-то слышно <b>мрр</b>";
  }
}
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => hint(misses >= 4), 25000); }

/* листание мышью на компьютере */
let down = false, startX = 0, startScroll = 0, moved = false;
vp.addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") return; down = true; moved = false; startX = e.clientX; startScroll = vp.scrollLeft; });
addEventListener("pointermove", (e) => { if (!down) return; const dx = e.clientX - startX; if (Math.abs(dx) > 5) { moved = true; vp.classList.add("drag"); } vp.scrollLeft = startScroll - dx; });
addEventListener("pointerup", () => { down = false; vp.classList.remove("drag"); setTimeout(() => moved = false, 0); });
vp.addEventListener("wheel", (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { vp.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
let swipeHidden = false;
vp.addEventListener("scroll", () => {
  if (!swipeHidden && Math.abs(vp.scrollLeft - startPos) > 40) { swipeHidden = true; document.getElementById("swipe").style.opacity = 0; }
});
let startPos = 0;
requestAnimationFrame(() => { startPos = Math.max(0, pano.clientWidth * .2 - innerWidth / 2 + 120); vp.scrollLeft = startPos; });

/* нашла */
const stage = document.getElementById("stage"), moisey = document.getElementById("moisey"), steam = document.getElementById("steam");
const dialog = document.getElementById("dialog"), lineEl = document.getElementById("line");
function findCat() {
  if (found) return;
  found = true; clearTimeout(idleTimer); haptic("heavy"); Sound.found();
  document.getElementById("task").style.opacity = 0;
  document.getElementById("swipe").style.opacity = 0;
  peek.classList.add("wiggle");
  setTimeout(() => {
    const pr = peek.getBoundingClientRect(), ir = document.getElementById("inner").getBoundingClientRect();
    peek.style.opacity = 0;
    const mw = ir.width * .76;
    moisey.style.setProperty("--fx", ((pr.left + pr.width / 2 - ir.left) - ir.width / 2 - mw / 2) + "px");
    moisey.style.setProperty("--fy", ((pr.top - ir.top) - ir.height * .12) + "px");
    stage.classList.add("on");
    moisey.classList.add("in");
    setTimeout(() => { dialog.classList.add("on"); showLine(); }, reduce ? 0 : 900);
  }, 700);
}

let li = 0, typing = false, typeTimer;
const face = document.getElementById("face");
const FRAMES = { closed: "moisey.png", half: "moisey_half.png", open: "moisey_open.png" };
Object.values(FRAMES).forEach(src => { const im = new Image(); im.src = src; });   // заранее, чтобы не мигало
const VOWELS = "аеёиоуыэюяaeiouy";
let wordTilt = 1;
function mouth(ch) {
  const c = (ch || "").toLowerCase();
  let f = "closed";
  if (VOWELS.includes(c)) f = "open";
  else if (/[a-zа-я]/i.test(c)) f = "half";
  if (c === " ") wordTilt = -wordTilt;
  face.style.backgroundImage = `url("${FRAMES[f]}")`;
  const lift = f === "open" ? -1.6 : f === "half" ? -0.6 : 0;
  face.style.transform = reduce ? "" : `translateY(${lift}%) rotate(${f === "closed" ? 0 : wordTilt * 1.2}deg)`;
}
function setMood(mood) {
  moisey.classList.remove("in", "grumpy", "soft"); moisey.classList.add(mood);
  steam.classList.toggle("on", mood === "grumpy"); hearts.on = mood === "soft";
}
function showLine() {
  const L = LINES[li];
  setMood(L.mood); haptic(L.mood === "grumpy" ? "rigid" : "soft");
  lineEl.textContent = ""; typing = true;
  document.getElementById("next").style.visibility = "hidden";
  let k = 0; clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    lineEl.textContent = L.text.slice(0, ++k);
    mouth(L.text[k - 1]);
    const ch = L.text[k - 1].toLowerCase();
    if ("аяоёуюэеиыaoueiy".includes(ch)) {
      const rest = L.text.slice(k);
      const lastSyl = !/[аяоёуюэеиыaoueiy]/i.test(rest);
      const tail = lastSyl ? (rest.includes("?") ? "?" : rest.includes("!") ? "!" : rest.includes("…") || L.text.startsWith("…") && false ? "…" : "") : "";
      Sound.syllable(ch, L.mood, tail);
    }
    if (k >= L.text.length) endType();
  }, reduce ? 1 : 55);
}
function endType() {
  clearInterval(typeTimer); typing = false; lineEl.textContent = LINES[li].text;
  mouth("");
  const last = li === LINES.length - 1;
  document.getElementById("next").style.visibility = last ? "hidden" : "visible";
  document.getElementById("goBtn").style.display = last ? "block" : "none";
}
dialog.addEventListener("click", (e) => {
  if (e.target.id === "goBtn") return;
  if (typing) { endType(); return; }
  if (li < LINES.length - 1) { li++; showLine(); }
});
document.getElementById("goBtn").addEventListener("click", () => { haptic("medium"); document.getElementById("stub").classList.add("on"); });
document.getElementById("restart").addEventListener("click", () => location.reload());

/* пиксельные сердечки */
const hc = document.getElementById("hearts"), hx = hc.getContext("2d");
const hearts = { on: false, list: [] };
function sizeHearts() { const r = document.getElementById("inner").getBoundingClientRect(); hc.width = r.width; hc.height = r.height; }
sizeHearts(); addEventListener("resize", sizeHearts);
function heartLoop() {
  hx.clearRect(0, 0, hc.width, hc.height);
  if (hearts.on && !reduce && Math.random() < .04)
    hearts.list.push({ x: hc.width * (.25 + Math.random() * .5), y: hc.height * .45, v: .5 + Math.random() * .5, life: 1 });
  hearts.list = hearts.list.filter(h => h.life > 0);
  const P = [[1,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[0,2],[1,2],[2,2],[3,2],[4,2],[1,3],[2,3],[3,3],[2,4]];
  hearts.list.forEach(h => {
    h.y -= h.v; h.x += Math.sin(h.y / 20) * .3; h.life -= .006;
    hx.globalAlpha = h.life; hx.fillStyle = "#f5b8c6";
    P.forEach(([i, j]) => hx.fillRect(h.x + i * 3, h.y + j * 3, 3, 3));
  });
  hx.globalAlpha = 1; requestAnimationFrame(heartLoop);
}
heartLoop();
resetIdle();
</script>
</body>
</html>

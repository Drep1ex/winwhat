<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Снежная тропа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --gold: #f3c76e; --paper: #fbf3ea; --ink: #2b1a17; --green: #6fae7c; --yellow: #e0b04e; --none: #3a2a26; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #26120f; overflow: hidden; }
body { font-family: Lora, Georgia, serif; color: var(--paper); user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; }
.app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; overflow: hidden;
  background: linear-gradient(rgba(24,10,8,.74), rgba(24,10,8,.9)), url("assets/room.png") 62% 0 / auto 100% no-repeat, #26120f; image-rendering: pixelated; }
.app img { image-rendering: auto; }
/* снег, огоньки, гирлянда, сугроб */
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.fx i { position: absolute; top: -10px; border-radius: 50%; background: var(--paper); animation: fall linear infinite; will-change: transform; }
@keyframes fall { 0% { transform: translate(0,-10px); } 50% { transform: translate(14px,52vh); } 100% { transform: translate(-6px,105vh); } }
.fx svg { position: absolute; animation: tw 3s ease-in-out infinite; } @keyframes tw { 0%,100% { opacity: .15; transform: scale(.7); } 50% { opacity: .9; transform: scale(1); } }
.garl { position: absolute; top: env(safe-area-inset-top); left: 0; width: 100%; height: 40px; z-index: 6; pointer-events: none; }
.bulb { animation: bulb 1.6s ease-in-out infinite; } @keyframes bulb { 50% { opacity: .35; } }
.halo { animation: halo 1.6s ease-in-out infinite; } @keyframes halo { 0%,100% { opacity: .35; } 50% { opacity: .05; } }
.ground { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom) + 24px); background: #eef2f6; border-radius: 50% 50% 0 0 / 14px 14px 0 0; opacity: .9; pointer-events: none; }
/* экраны */
.screen { position: absolute; inset: 0; z-index: 2; transition: opacity .45s ease, transform .45s ease; }
.screen.hide { opacity: 0; transform: translateY(14px); pointer-events: none; }
.screen[hidden] { display: none; }
/* Моисей: моргает */
.mo { position: relative; flex: none; }
.mo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.mo .eyes { opacity: 0; }
.mo.blink .eyes { opacity: 1; }
.mo.hop { animation: hop .45s ease-out; } @keyframes hop { 40% { transform: translateY(-10px) scale(.98,1.04); } }
.say { background: var(--paper); color: var(--ink); border-radius: 16px 16px 16px 4px; padding: 9px 12px; font-size: 14px; font-weight: 700; line-height: 1.35;
  box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--gold); transition: opacity .25s, transform .25s; }
.say.pop { animation: sayPop .3s ease-out; } @keyframes sayPop { from { opacity: 0; transform: translateY(6px) scale(.96); } }

/* ===== главная: снежная тропа ===== */
.m-head { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 44px); text-align: center; z-index: 3; }
.m-head small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #e6c3b0; }
.m-head h1 { margin: 0; font-family: "Marck Script", cursive; font-weight: 400; font-size: 40px; line-height: 1.05; color: var(--gold); text-shadow: 0 0 18px rgba(243,199,110,.35); }
.bag { position: absolute; z-index: 3; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 112px); background: rgba(30,14,12,.84); border-radius: 18px; padding: 10px 12px; box-shadow: 0 0 0 1px rgba(243,199,110,.4); }
.bag-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.bag-h b { font-family: "Marck Script", cursive; font-weight: 400; font-size: 22px; color: var(--gold); }
.bag-h span { font-size: 12px; font-weight: 700; color: #e6c3b0; }
.bag-l { display: flex; gap: 8px; justify-content: center; }
.lt { width: 40px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
.lt.on { background: var(--paper); color: #7a2a20; box-shadow: 0 3px 0 #c9ad9e, 0 0 14px rgba(243,199,110,.35); }
.lt.off { border: 2px dashed rgba(251,243,234,.35); color: rgba(251,243,234,.4); font-size: 20px; }
.lt.drop { animation: drop .9s cubic-bezier(.3,1.6,.5,1); } @keyframes drop { 0% { transform: translateY(-120px) rotate(-30deg); opacity: 0; } 60% { opacity: 1; } }
.path { position: absolute; z-index: 2; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 214px); bottom: calc(env(safe-area-inset-bottom) + 130px); }
.path svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.st { position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
.st.done { background: var(--paper); box-shadow: 0 0 0 4px #c9a24e; color: #7a2a20; font-size: 26px; font-weight: 700; }
.st.cur { background: var(--gold); box-shadow: 0 0 0 4px #fff6dc, 0 0 30px 6px rgba(243,199,110,.6); color: #3a2508; font-family: "Marck Script", cursive; font-size: 30px; animation: stPulse 1.8s ease-in-out infinite; }
@keyframes stPulse { 50% { box-shadow: 0 0 0 4px #fff6dc, 0 0 40px 12px rgba(243,199,110,.75); } }
.st.lock { background: #3a2118; box-shadow: inset 0 0 0 3px #6b4636; color: rgba(251,243,234,.45); }
.st:active { transform: scale(.94); }
.st-l { position: absolute; width: 140px; margin-top: -20px; font-size: 13.5px; font-weight: 700; line-height: 1.25; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
.st-l small { display: block; font-size: 11px; letter-spacing: .08em; }
.m-mo { position: absolute; z-index: 4; width: 62px; height: 76px; margin: -46px 0 0 -31px; transition: left .9s ease, top .9s ease; pointer-events: none; }
.m-say { position: absolute; z-index: 5; left: 14px; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 96px); opacity: 0; transform: translateY(6px); pointer-events: none; }
.m-say.on { opacity: 1; transform: none; }
.go { position: absolute; z-index: 5; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 34px); }
.btn { width: 100%; font-size: 16px; font-weight: 700; border: 0; border-radius: 12px; padding: 14px; background: var(--gold); color: #3a2508; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.btn:active { transform: scale(.98); }
.btn.ghost { background: transparent; color: #ecd6c8; box-shadow: 0 0 0 2px rgba(236,214,200,.5); }

/* ===== этап: шапка ===== */
.hud { position: absolute; z-index: 5; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 40px); padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hud h2 { margin: 0; font-family: "Marck Script", cursive; font-weight: 400; font-size: clamp(26px, 8vw, 32px); white-space: nowrap; color: var(--gold); line-height: 1; }
.pill { white-space: nowrap; font-size: 14px; font-weight: 700; color: #3a2508; background: var(--gold); border-radius: 99px; padding: 5px 12px; }
.x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(30,14,12,.8); color: var(--gold); box-shadow: 0 0 0 1px rgba(243,199,110,.5); display: flex; align-items: center; justify-content: center; flex: none; }

/* ===== этап 1: тайное слово ===== */
.w-round { position: absolute; z-index: 4; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 88px); display: flex; justify-content: center; gap: 8px; font-size: 12px; font-weight: 700; color: #e6c3b0; letter-spacing: .06em; }
.w-round i { width: 26px; height: 6px; border-radius: 3px; background: rgba(251,243,234,.18); margin-top: 5px; }
.w-round i.on { background: var(--gold); } .w-round i.ok { background: var(--green); }
.w-card { position: absolute; z-index: 3; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 112px); height: var(--cardH, 360px); border-radius: 20px; background: rgba(30,14,12,.84); box-shadow: 0 0 0 1px rgba(243,199,110,.4); }
.w-garl { position: absolute; left: 0; right: 0; top: -12px; height: 30px; pointer-events: none; }
.w-scroll { position: absolute; inset: 16px 8px 10px; overflow-y: auto; scrollbar-width: none; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
.w-scroll::-webkit-scrollbar { display: none; }
.w-grid { display: flex; flex-direction: column; align-items: center; gap: var(--gap, 7px); }
.w-row { display: flex; flex-direction: column; align-items: flex-start; gap: var(--lg, 5px); }
.w-line { display: flex; align-items: center; justify-content: flex-start; gap: var(--tg, 6px); }
.w-lamp.ghost { visibility: hidden; }
.w-row.shake { animation: shake .4s; } @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.w-lamp { width: 12px; height: 17px; border-radius: 50% 50% 46% 46%; background: rgba(251,243,234,.12); flex: none; margin-right: 4px; transition: background .3s, box-shadow .3s; }
.w-lamp.used { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.w-lamp.cur { background: var(--paper); }
.w-sp { width: var(--sp, 10px); flex: none; }
.t { width: var(--ts, 52px); height: var(--ts, 52px); border-radius: calc(var(--ts, 52px) * .22); background: rgba(251,243,234,.06); box-shadow: inset 0 0 0 2px rgba(251,243,234,.22);
  color: var(--paper); font-size: calc(var(--ts, 52px) * .48); font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; transition: transform .1s; }
.t.typed { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 2px var(--gold); animation: tIn .12s ease-out; }
@keyframes tIn { 50% { transform: scale(1.1); } }
.t.g, .t.y, .t.n { box-shadow: none; }
.t.g { background: var(--green); color: #fff; box-shadow: 0 0 14px rgba(111,174,124,.7); }
.t.y { background: var(--yellow); color: #2a1610; box-shadow: 0 0 14px rgba(224,176,78,.7); }
.t.n { background: var(--none); color: #a8968c; }
.t.flip { animation: flip .5s ease-in-out both; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.t.win { animation: win .6s ease-out both; } @keyframes win { 40% { transform: translateY(-12px) scale(1.08); } }
.w-mo { position: absolute; z-index: 4; left: 8px; right: 10px; top: calc(env(safe-area-inset-top) + 112px + var(--cardH, 360px) + 10px); display: flex; align-items: flex-end; gap: 6px; }
.w-mo .mo { width: 64px; height: 79px; }
.w-mo .say { flex: 1; margin-bottom: 8px; font-size: 13.5px; }
.kb { position: absolute; z-index: 4; left: 4px; right: 4px; bottom: calc(env(safe-area-inset-bottom) + 30px); display: flex; flex-direction: column; gap: 7px; }
.kb div { display: flex; gap: 4px; }
.k { flex: 1; height: 44px; border: 0; padding: 0; border-radius: 8px; background: #6b4636; color: var(--paper); font-size: 15px; font-weight: 700; box-shadow: 0 3px 0 rgba(0,0,0,.35); transition: background .3s, color .3s; }
.k:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.k.g { background: var(--green); } .k.y { background: var(--yellow); color: #2a1610; } .k.n { background: #2a1610; color: rgba(251,243,234,.3); }
.k.wide { flex: 1.6; background: var(--gold); color: #3a2508; font-size: 12px; } .k.del { flex: 1.4; }
/* окно «слово отгадано» */
.sheet { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(10,4,3,.72); transition: opacity .35s; }
.sheet[hidden] { display: none; } .sheet.fade { opacity: 0; }
.card { width: 100%; max-width: 360px; max-height: calc(100% - 20px); overflow-y: auto; background: #4b2b1f; border-radius: 20px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 12px; text-align: center;
  box-shadow: inset 0 0 0 4px #3a2118, 0 0 0 1px #8a6447, 0 14px 30px rgba(0,0,0,.45); animation: cardIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } }
.card small { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #e6c3b0; }
.card .word { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
.card .word span { width: 30px; height: 34px; border-radius: 7px; background: var(--green); color: #fff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(111,174,124,.6); }
.card .word span.sp { width: 10px; background: none; box-shadow: none; }
.card .pics { display: flex; gap: 8px; }
.card .pics div { flex: 1; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: #2a1712; box-shadow: 0 0 0 2px #6b4636; }
.card .pics img { width: 100%; height: 100%; display: block; object-fit: cover; cursor: zoom-in; }
.zoom { position: absolute; inset: 0; z-index: 40; background: rgba(10,4,3,.92); display: flex; align-items: center; justify-content: center; padding: 14px; opacity: 0; transition: opacity .3s; }
.zoom.on { opacity: 1; }
.zoom img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.card p { margin: 0; font-size: 14.5px; font-weight: 600; color: #ecd6c8; line-height: 1.5; text-align: left; }
.card h3 { margin: 0; font-family: "Marck Script", cursive; font-weight: 400; font-size: 34px; color: var(--gold); line-height: 1.05; }
.big-letter { align-self: center; width: 86px; height: 98px; border-radius: 16px; background: var(--paper); color: #7a2a20; font-size: 54px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 5px 0 #c9ad9e, 0 0 34px rgba(243,199,110,.6); animation: bigIn .8s cubic-bezier(.3,1.6,.5,1); }
@keyframes bigIn { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
/* заглушка этапов */
.soon { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; text-align: center; }
.soon h3 { margin: 0; font-family: "Marck Script", cursive; font-weight: 400; font-size: 36px; color: var(--gold); }
.soon p { margin: 0; font-size: 15px; font-weight: 600; color: #ecd6c8; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="fx" id="fx" aria-hidden="true"></div>
  <svg class="garl" id="garl" viewBox="0 0 390 40" preserveAspectRatio="none" aria-hidden="true"></svg>

  <!-- главная: снежная тропа -->
  <section class="screen" id="home">
    <div class="m-head"><small>ДОРОГА ИЗ ПЯТИ ЗАГАДОК</small><h1>Снежная тропа</h1></div>
    <div class="bag"><div class="bag-h"><b>Мешочек букв</b><span id="bagCount">0 из 5 · порядок — в конце</span></div><div class="bag-l" id="bag"></div></div>
    <div class="path" id="path"></div>
    <div class="m-say" id="mSay"><div class="say" id="mSayT"></div></div>
    <div class="go"><button type="button" class="btn" id="goBtn">Идти к загадке №1</button></div>
  </section>

  <!-- этап 1: тайное слово -->
  <section class="screen" id="s1" hidden>
    <div class="hud"><h2>Тайное слово</h2><span style="display:flex;gap:8px;align-items:center"><span class="pill">1 / 5</span>
      <button type="button" class="x" data-home aria-label="К тропе"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
    <div class="w-round" id="wRound"></div>
    <div class="w-card" id="wCard">
      <svg class="w-garl" viewBox="0 0 370 30" preserveAspectRatio="none" aria-hidden="true"><path d="M4 8 Q 92 26 185 14 T 366 8" fill="none" stroke="#2a1610" stroke-width="2.5"/>
        <circle class="halo" cx="40" cy="16" r="9" fill="#d8574a"/><circle class="bulb" cx="40" cy="16" r="4.5" fill="#d8574a"/>
        <circle class="halo" style="animation-delay:-.4s" cx="100" cy="21" r="9" fill="#f3c76e"/><circle class="bulb" style="animation-delay:-.4s" cx="100" cy="21" r="4.5" fill="#f3c76e"/>
        <circle class="halo" style="animation-delay:-.8s" cx="160" cy="19" r="9" fill="#6fae7c"/><circle class="bulb" style="animation-delay:-.8s" cx="160" cy="19" r="4.5" fill="#6fae7c"/>
        <circle class="halo" style="animation-delay:-1.2s" cx="225" cy="14" r="9" fill="#7fb0e0"/><circle class="bulb" style="animation-delay:-1.2s" cx="225" cy="14" r="4.5" fill="#7fb0e0"/>
        <circle class="halo" cx="285" cy="11" r="9" fill="#d8574a"/><circle class="bulb" cx="285" cy="11" r="4.5" fill="#d8574a"/>
        <circle class="halo" style="animation-delay:-.4s" cx="340" cy="10" r="9" fill="#f3c76e"/><circle class="bulb" style="animation-delay:-.4s" cx="340" cy="10" r="4.5" fill="#f3c76e"/></svg>
      <div class="w-scroll" id="wScroll"><div class="w-grid" id="wGrid"></div></div>
    </div>
    <div class="w-mo"><div class="mo" id="wMo"><img src="assets/moisey_smile.png" alt="Моисей" class="face"><img src="assets/moisey_proud.png" alt="" class="eyes"></div><div class="say" id="wSay"></div></div>
    <div class="kb" id="kb"></div>
    <div class="sheet" id="wDone" hidden><div class="card" id="wDoneCard"></div></div>
  </section>

  <!-- заглушка остальных этапов -->
  <section class="screen" id="sSoon" hidden>
    <div class="hud"><h2 id="soonTitle">Загадка</h2><span style="display:flex;gap:8px;align-items:center"><span class="pill" id="soonPill">2 / 5</span>
      <button type="button" class="x" data-home aria-label="К тропе"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
    <div class="soon"><div class="mo" style="width:120px;height:148px"><img src="assets/moisey.png" alt="Моисей" class="face"><img src="assets/moisey_blink.png" alt="" class="eyes"></div>
      <h3>Скоро</h3><p>Эту загадку Данил с Моисеем ещё мастерят. Загляни позже!</p>
      <button type="button" class="btn ghost" data-home style="max-width:240px">К тропе</button>
      <button type="button" class="btn" id="soonSkip" style="max-width:240px">Пропустить (для проверки)</button></div>
  </section>

  <div class="ground"></div>
</div>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const wait = (ms) => new Promise(r => setTimeout(r, ms));
// ответы лежат в коде не открытым текстом
const un = (s) => [...s].reverse().map(c => String.fromCharCode(c.charCodeAt(0) - 7)).join("");

/* ---------- звук ---------- */
let ac = null;
function A() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); return ac; }
function tone(at, f, dur, vol, f2, type) {
  const c = A(); if (!c) return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(.02, dur * .3)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
const SND = {
  key() { tone(0, 660, .06, .05, 520, "triangle"); },
  del() { tone(0, 420, .07, .05, 300, "triangle"); },
  bad() { tone(0, 220, .18, .12, 150, "triangle"); },
  tile(r) { tone(0, r === "g" ? 880 : r === "y" ? 660 : 330, .18, .07); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(i * .1, f, .6, .1)); },
  letter() { [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(i * .08, f, .8, .09)); },
};
const vib = (k) => { try { navigator.vibrate && navigator.vibrate(k === "heavy" ? 40 : 12); } catch (e) {} };

/* ---------- снег, огоньки, гирлянда ---------- */
(function decor() {
  let h = "";
  for (let i = 0; i < 26; i++) { const s = 3 + Math.random() * 3;
    h += `<i style="left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${9 + Math.random() * 9}s;animation-delay:-${Math.random() * 18}s;opacity:${.35 + Math.random() * .45}"></i>`; }
  for (let i = 0; i < 9; i++) { const s = 8 + Math.random() * 5;
    h += `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="left:${Math.random() * 96}%;top:${Math.random() * 90}%;animation-delay:-${Math.random() * 3}s"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z" fill="#f3c76e"/></svg>`; }
  $("fx").innerHTML = h;

/* ---------- экраны ---------- */

const POS = [[.22, .09], [.78, .31], [.22, .53], [.78, .75], [.5, .93]];   // доли ширины/высоты тропы

}
let sayT;
function homeSay(t, ms) { $("mSayT").textContent = t; $("mSay").classList.add("on"); clearTimeout(sayT); sayT = setTimeout(() => $("mSay").classList.remove("on"), ms || 2600); if (homeMo) setFace(homeMo, "smile"); }
$("goBtn").addEventListener("click", () => { A(); vib(); if (P.done < 5) openStage(P.done); });
addEventListener("resize", () => { if (cur === "home") renderHome(); else if (cur === "s1") sizeGrid(); });

function openStage(i) {
  A(); vib();
  if (i === 0) { openWord(); return; }
  $("soonTitle").textContent = STAGES[i]; $("soonPill").textContent = `${i + 1} / 5`; $("soonSkip").dataset.i = i;

  pendingDrop = true; show("home");

}

/* ================= этап 1: тайное слово ================= */
const WORDS = ["ШХЩХТ", "КФХСФХК", "ЗЛФЗЦ'жЗФШЗЧС"].map(un);
const INFO = [
  { pics: ["lotus1", "lotus2"], text: "Лотос — священный цветок Китая. Он растёт из ила, но поднимается над водой чистым, поэтому его считают символом чистоты и счастья. В Китае лотос рисуют на вазах, вышивают на шёлке, а его семена и корни едят. Отсюда и выражение, которое говорят о людях: «Лотос рождается в грязи, но остаётся чистым» — о тех, кто сохраняет доброе сердце, что бы ни творилось вокруг." },
  { pics: ["hk2", "hk1"], text: "Гонконг — по-китайски «ароматная гавань». Бухта Виктория — одна из лучших естественных глубоководных гаваней мира, и Гонконг много лет входил в число крупнейших контейнерных портов планеты. Небоскрёбы там растут прямо из гор, а между берегами до сих пор ходят паромы «Стар Ферри»." },
  { pics: ["panda1", "panda2"], text: "Красная, или малая, панда живёт в бамбуковых лесах Китая и Гималаев. Её открыли на 50 лет раньше большой панды, и слово «панда» сначала было именно её именем. Почти весь день она спит на ветке, свесив лапы, а мёрзнет — заворачивается в пушистый хвост, как в шарф. Ты уже знакома с ней :)" },
];
const HINTS = [
  ["Это цветок. Красивый. Растёт в воде.", "В Китае на нём сидит Будда. Ну, на картинках."],
  ["Это город. И порт! Корабли там стоят в очередь.", "Он на юге Китая, там очень высокие дома."],
  ["Это животное. Пушистое. Рыжее.", "Ты его очень любишь. Не меня — его. Обидно."],
];
const ROWS = ["ЙЦУКЕНГШЩЗХ", "ФЫВАПРОЛДЖЭ", "ЯЧСМИТЬБЮ"];
let round = 0, guesses = [], typed = [], busy = false, letters = 0, cellsPerRow = [];
function shape(w) { return [...w].map(c => c === " " ? null : c); }
function score(g, ans) {
  const a = [...ans].filter(c => c !== " "), res = g.map(() => "n"), pool = {};
  a.forEach((c, i) => { if (g[i] === c) res[i] = "g"; else pool[c] = (pool[c] || 0) + 1; });
  g.forEach((c, i) => { if (res[i] !== "g" && pool[c]) { res[i] = "y"; pool[c]--; } });
  return res;
}
function buildKb() {
  let h = "";
  ROWS.forEach((r, k) => {
    h += "<div>";
    if (k === 2) h += '<button type="button" class="k wide" data-k="enter">ВВОД</button>';
    h += [...r].map(c => `<button type="button" class="k" data-k="${c}">${c}</button>`).join("");
    if (k === 2) h += '<button type="button" class="k del" data-k="del" aria-label="Стереть">⌫</button>';
    h += "</div>";
  });
  $("kb").innerHTML = h;
}
buildKb();
$("kb").addEventListener("pointerdown", (e) => { const b = e.target.closest(".k"); if (!b) return; e.preventDefault(); press(b.dataset.k); });
addEventListener("keydown", (e) => {
  if (cur !== "s1" || !$("wDone").hidden) return;
  if (e.key === "Enter") press("enter"); else if (e.key === "Backspace") press("del");
  else { let c = e.key.toUpperCase(); if (c === "Ё") c = "Е"; if (/^[А-ЯЁ]$/.test(c)) press(c); }
});
// слова в раунде: одно слово — одна строка; два слова — каждое на своей строке, так клетки крупнее
const parts = () => WORDS[round].split(" ");
let fitRows = 6;
function sizeGrid() {
  const ps = parts(), n = Math.max(...ps.map(w => w.length)), two = ps.length > 1;
  const app = $("app"), card = $("wCard"), avail = Math.min(480, app.clientWidth) - 20 - 16 - 22;   // поля и лампочка
  const gap = n > 7 ? 4 : 6;
  const ts = Math.max(26, Math.min(54, Math.floor((avail - gap * (n - 1)) / n)));
  const cardH = Math.max(230, Math.min(420, app.clientHeight - 112 - 98 - 200 - 40));
  const rowGap = two ? 12 : (ts > 40 ? 7 : 5), lineGap = 5;
  const rowH = two ? ts * 2 + lineGap : ts;
  card.style.setProperty("--ts", ts + "px"); card.style.setProperty("--tg", gap + "px");
  card.style.setProperty("--gap", rowGap + "px"); card.style.setProperty("--lg", lineGap + "px");
  app.style.setProperty("--cardH", cardH + "px");
  fitRows = Math.max(3, Math.floor((cardH - 26 + rowGap) / (rowH + rowGap)));   // сколько попыток влезает без прокрутки
}
function rowHTML(i) {
  const ans = WORDS[round], ps = parts(), g = guesses[i], isCur = i === guesses.length;
  const res = g ? score(g, ans) : null;
  let k = 0;
  const lines = ps.map((w, li) => {
    let h = li === 0 ? `<span class="w-lamp ${g ? "used" : isCur ? "cur" : ""}"></span>` : '<span class="w-lamp ghost"></span>';
    for (let j = 0; j < w.length; j++) {
      const ch = g ? g[k] : isCur ? (typed[k] || "") : "";
      const cls = g ? res[k] : ch ? "typed" : "";
      h += `<span class="t ${cls}">${ch}</span>`; k++;
    }
    return `<div class="w-line">${h}</div>`;
  }).join("");
  return `<div class="w-row" data-r="${i}">${lines}</div>`;
}
function renderGrid() {
  const total = Math.max(guesses.length + 1, fitRows);
  let h = ""; for (let i = 0; i < total; i++) h += rowHTML(i);
  $("wGrid").innerHTML = h;
  requestAnimationFrame(() => scrollToCur());
}
function scrollToCur() {
  const sc = $("wScroll"), row = $("wGrid").children[guesses.length]; if (!row) return;
  const want = row.offsetTop + row.offsetHeight - sc.clientHeight + 4;
  if (want > sc.scrollTop) sc.scrollTop = want;                         // плавно уезжает на строку вниз
}
function paintKb() {
  const st = {}, ans = WORDS[round];
  guesses.forEach(g => score(g, ans).forEach((r, i) => { const c = g[i], o = st[c]; if (r === "g" || (r === "y" && o !== "g") || (!o)) st[c] = r; }));
  $("kb").querySelectorAll(".k[data-k]").forEach(b => { b.classList.remove("g", "y", "n"); if (st[b.dataset.k]) b.classList.add(st[b.dataset.k]); });
}
function renderRound() {
  $("wRound").innerHTML = `РАУНД ${round + 1} ИЗ 3` + [0, 1, 2].map(i => `<i class="${i < round ? "ok" : i === round ? "on" : ""}"></i>`).join("");
}
function say(t, face) { const s = $("wSay"); s.textContent = t; s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop"); setFace($("wMo"), face || "smile"); }
function openWord() {
  round = P.s1.round || 0; guesses = (P.s1.guesses || []).map(g => [...g]); typed = [];
  if (round > 2) round = 2;
  sizeGrid(); renderRound(); renderGrid(); paintKb(); $("wDone").hidden = true;
  show("s1");
  const n = [...WORDS[round]].filter(c => c !== " ").length;
  setTimeout(() => say(guesses.length ? "Продолжаем! Я запомнил все твои попытки." : round === 0 ? `Угадай слово из ${n} букв. Зелёный — буква на месте, жёлтый — есть, но не тут.` : `Раунд ${round + 1}: ${WORDS[round].includes(" ") ? "два слова, 7 и 5 букв" : n + " букв"}. Попыток сколько угодно!`), 350);
}
function press(k) {
  if (busy || cur !== "s1") return;
  const n = [...WORDS[round]].filter(c => c !== " ").length, row = $("wGrid").children[guesses.length];
  if (k === "del") { if (typed.length) { typed.pop(); SND.del(); updRow(row); } return; }
  if (k === "enter") { submit(); return; }
  if (typed.length >= n) return;
  typed.push(k); SND.key(); updRow(row);
}
function updRow(row) {
  if (!row) return;
  const tiles = row.querySelectorAll(".t");
  tiles.forEach((t, i) => { const c = typed[i] || ""; if (t.textContent !== c) { t.textContent = c; t.className = "t" + (c ? " typed" : ""); } });
}
const LINES_OK = { 0: ["Ни одной буквы… Зато теперь знаем, чего там нет!", "Пусто. Ну и ладно, вычёркиваем.", "Мимо. Но мимо — тоже информация!"],
  1: ["Одна есть! Уже теплее.", "Буква поймана. Ищем остальных.", "Есть контакт!"],
  2: ["Две буквы! Неплохо.", "Уже кое-что вырисовывается…", "Тепло-тепло!"],
  3: ["Больше половины! Я чую слово.", "Горячо! Ещё чуть-чуть.", "Ого, ты близко!"] };
async function submit() {
  const ans = WORDS[round], n = [...ans].filter(c => c !== " ").length, row = $("wGrid").children[guesses.length];
  if (typed.length < n) {
    SND.bad(); vib(); row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
    say(pick(["Не хватает букв!", `Нужно ${n} букв. Я посчитал.`, "Слово ещё не дописано!"]), "plain"); return;
  }
  busy = true;
  const g = typed.slice(), res = score(g, ans), tiles = [...row.querySelectorAll(".t")];
  row.querySelector(".w-lamp").className = "w-lamp used";
  for (let i = 0; i < tiles.length; i++) {
    const t = tiles[i]; t.classList.add("flip");
    setTimeout(() => { t.className = "t flip " + res[i]; SND.tile(res[i]); }, 250);
    await wait(tiles.length > 9 ? 110 : 190);
  }
  await wait(350);
  guesses.push(g); typed = []; P.s1 = { round, guesses: guesses.map(x => x.join("")) }; save();
  paintKb();
  const win = res.every(r => r === "g");
  if (win) { busy = false; tiles.forEach((t, i) => setTimeout(() => { t.classList.remove("flip"); t.classList.add("win"); }, i * 70)); SND.win(); vib("heavy"); setTimeout(roundWon, 1100); return; }
  // новая пустая строка снизу, сетка плавно уезжает
  const grid = $("wGrid");
  if (grid.children.length <= guesses.length) grid.insertAdjacentHTML("beforeend", rowHTML(guesses.length));
  else grid.children[guesses.length].outerHTML = rowHTML(guesses.length);
  requestAnimationFrame(scrollToCur);
  const greens = res.filter(r => r === "g").length, share = (greens + res.filter(r => r === "y").length * .5) / n;
  const tries = guesses.length;
  if (tries === 7 || tries === 13) say("Подсказка от кота: " + HINTS[round][tries === 7 ? 0 : 1], "proud");
  else say(pick(LINES_OK[share === 0 ? 0 : share < .3 ? 1 : share < .55 ? 2 : 3]), share >= .55 ? "proud" : "smile");
  busy = false;
}
function roundWon() {
  const ans = WORDS[round], info = INFO[round];
  const word = [...ans].map(c => c === " " ? '<span class="sp"></span>' : `<span>${c}</span>`).join("");
  const tries = guesses.length;
  $("wDoneCard").innerHTML = `<small>РАУНД ${round + 1} ИЗ 3 · ${tries} ${tries % 10 === 1 && tries % 100 !== 11 ? "ПОПЫТКА" : tries % 10 >= 2 && tries % 10 <= 4 && (tries % 100 < 12 || tries % 100 > 14) ? "ПОПЫТКИ" : "ПОПЫТОК"}</small>
    <div class="word">${word}</div>
    <div class="pics">${info.pics.map(p => `<div><img src="assets/${p}.jpg" alt=""></div>`).join("")}</div>
    <p>${info.text}</p>
    <button type="button" class="btn" id="wNext">${round < 2 ? "Следующее слово" : "Забрать букву"}</button>`;
  $("wDone").hidden = false;
  say(round === 0 ? "Угадала! Лотос — как ты: красивый и… ну, ты поняла." : round === 1 ? "Гонконг! Данил одобряет — там отличная гавань." : "КРАСНАЯ ПАНДА! Я, конечно, лучше. Но она тоже ничего.", "proud");
  $("wNext").addEventListener("click", () => {
    vib();
    const s = $("wDone"); s.classList.add("fade");
    setTimeout(() => { s.hidden = true; s.classList.remove("fade"); }, 350);
    if (round < 2) {
      round++; guesses = []; typed = []; P.s1 = { round, guesses: [] }; save();
      sizeGrid(); renderRound(); renderGrid(); paintKb();
      const n = [...WORDS[round]].filter(c => c !== " ").length;
      setTimeout(() => say(round === 1 ? `Слово посложнее: ${n} букв. Оно связано с морем… и с Китаем.` : "Последнее! Два слова: 7 и 5 букв. Ты это точно знаешь."), 400);
    } else { P.s1 = { round: 3, guesses: [] }; save(); setTimeout(() => giveLetter(0), 300); }
  });
}

/* ---------- фото на весь экран по тапу ---------- */
document.addEventListener("click", (e) => {
  const im = e.target.closest(".pics img"); if (!im) return;
  const v = document.createElement("div"); v.className = "zoom"; v.innerHTML = `<img src="${im.getAttribute("src")}" alt="">`;

// фото заранее, чтобы карточка открывалась сразу
INFO.forEach(i => i.pics.forEach(p => { const im = new Image(); im.src = "assets/" + p + ".jpg"; }));

renderHome();
setTimeout(() => homeSay(P.done === 0 ? "Это тропа из пяти загадок. За каждую — буква. Пошли?" : P.done >= 5 ? "Ты прошла всю тропу!" : "С возвращением! Тропа ждёт.", 3600), 700);
window.__sneg = { P, WORDS };
